# CodeQL で JavaScript / TypeScript と workflow（actions）のコードを調べる。公開リポジトリなので無料。
# 非公開の開発用リポジトリでは Code scanning が使えず、毎回「Resource not accessible by integration」で失敗するので動かさない
# （公開の前は scripts/codeql-local.sh が同じ中身を手元の CodeQL で調べる。publish-squash.sh がその記録を求める）。
# 結果はリポジトリの Security > Code scanning に出る。ビルドは要らない（build-mode: none）ので、依存も入れない。
# actions はコミットの SHA に固定し、コメントに版を書く（test/unit/release-policy.test.ts が確かめる）。
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 毎週月曜（新しく見つかった種類の問題を、変更が無くても拾う）
    - cron: '23 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    if: github.repository == 'JapanMarketing-Dev/ferret'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}
